name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: make test

  macos-package:
    runs-on: macos-14
    env:
      PAPER_ATLAS_PYTHON_RUNTIME_SOURCE: /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9
      PAPER_ATLAS_PYTHON_RUNTIME_LABEL: GitHub macOS runner universal2 Python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make mac-app
      - run: codesign --verify --deep --strict "Paper Atlas.app"
      - run: make release
      - run: python scripts/release_check.py --skip-library
