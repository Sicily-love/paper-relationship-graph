name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: make test

  macos-package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make mac-app
      - run: codesign --verify --deep --strict "Paper Atlas.app"
      - run: make release
      - run: python scripts/release_check.py --skip-library
      - uses: actions/upload-artifact@v6
        with:
          name: Paper-Atlas-1.0.0-macos
          path: |
            dist/Paper-Atlas-1.0.0.dmg
            dist/Paper-Atlas-1.0.0.dmg.sha256
