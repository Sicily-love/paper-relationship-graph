name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - name: Run tests related to this change
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make test TEST_BASE="$TEST_BASE"
      - name: Run the full suite on main and release tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: make test-full

  macos-package:
    runs-on: macos-14
    env:
      PAPER_ATLAS_PYTHON_RUNTIME_SOURCE: /Library/Developer/CommandLineTools/Library/Frameworks/Python3.framework/Versions/3.9
      PAPER_ATLAS_PYTHON_RUNTIME_LABEL: GitHub macOS runner universal2 Python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make mac-app
      - run: codesign --verify --deep --strict "Paper Atlas.app"
      - run: make release
      - run: python scripts/release_check.py --skip-library
